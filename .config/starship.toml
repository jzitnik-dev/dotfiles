# A clean, barebones prompt
format = """
$username\
$directory\
$git_branch\
$git_status\
$character"""

# Optional: Disable the blank line at the start of the prompt
# add_newline = false
command_timeout = 5000

[username]
show_always = true
style_user = "bold blue"
style_root = "bold red"
# Removed "in" - just prints the username and a space
format = '[$user]($style) '

[directory]
style = "bold cyan"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
symbol = "git:"
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '[$all_status$ahead_behind]($style) '

[character]
# Uses a standard ASCII greater-than sign instead of a unicode chevron
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

# ---------------------------------------------------
# Module Simplifications (Removing standard Unicode icons)
# ---------------------------------------------------

[docker_context]
symbol = "docker "

[nodejs]
symbol = "node "

[rust]
symbol = "rust "

[golang]
symbol = "go "

[python]
symbol = "py "

[c]
symbol = "c "

[java]
symbol = "java "

# ---------------------------------------------------
# Disabled Modules (To keep the prompt clean)
# ---------------------------------------------------

[time]
disabled = true

[package]
disabled = true
